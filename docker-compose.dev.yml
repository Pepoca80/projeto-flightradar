# ════════════════════════════════════════════════════════════════════
#  usp-airline — Ambiente de Desenvolvimento
# ════════════════════════════════════════════════════════════════════

name: usp-airline-dev

networks:
  usp-airline-net:
    name: usp-airline-net
    driver: bridge

volumes:
  mosquitto_data_sudeste:
  cassandra_data_sudeste:

services:

  # ── GEODNS ──
  geodns:
    build: ./geodns
    container_name: usp-airline-geodns
    ports:
      - "8080:8080"
    networks:
      - usp-airline-net
    restart: unless-stopped

# ── REGIÃO SUDESTE ──
  broker_sudeste:
    build: ./broker
    container_name: usp-airline-broker-sudeste
    ports:
      - "1892:1883"
    volumes:
      - mosquitto_data_sudeste:/mosquitto/data
      - ./broker/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    networks:
      - usp-airline-net
    restart: unless-stopped

  banco_sudeste:
    image: cassandra:latest
    container_name: usp-airline-cassandra-sudeste
    mem_limit: 1536m
    environment:
      CASSANDRA_CLUSTER_NAME: usp-airline
      CASSANDRA_DC: datacenter1
      CASSANDRA_SEEDS: banco_sudeste
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "128M"
    volumes:
      - cassandra_data_sudeste:/var/lib/cassandra
    networks:
      - usp-airline-net

  servidor_sudeste:
    build: ./servidor
    container_name: usp-airline-servidor-sudeste
    ports:
      - "4002:4000"
    environment:
      BROKER_URL: mqtt://broker_sudeste:1883
      HTTP_PORT: "4000"
      CASSANDRA_CONTACT_POINTS: banco_sudeste
      CASSANDRA_DATACENTER: datacenter1
      CASSANDRA_KEYSPACE: usp_airlines
    networks:
      - usp-airline-net
    depends_on:
      broker_sudeste: { condition: service_started }
      banco_sudeste: { condition: service_started }
    restart: unless-stopped

  # ── FRONTEND ──
  frontend:
    build: ./frontend
    container_name: usp-airline-frontend
    ports:
      - "3000:80"
    networks:
      - usp-airline-net
    depends_on:
      - servidor_sudeste
    restart: unless-stopped

  # ── AVIÕES ──────────────────────────────────────────────────────────
  aviao-la3105:
    build: ./aviao
    container_name: usp-airline-aviao-LA3105
    environment:
      GEODNS_URL: http://geodns:8080
      CALLSIGN: LA3105
      AIRLINE: LATAM
      IATA_AIRLINE: LA
      ORIGIN: GRU
      DESTINATION: GIG
      UPDATE_MS: "1000"
    networks: [usp-airline-net]
    depends_on: [geodns]
    restart: on-failure:5

  aviao-la3240:
