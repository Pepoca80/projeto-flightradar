# ════════════════════════════════════════════════════════════════════
#  usp-airline — Ambiente de Desenvolvimento
# ════════════════════════════════════════════════════════════════════

name: usp-airline-dev

networks:
  usp-airline-net:
    name: usp-airline-net
    driver: bridge

volumes:
  mosquitto_data_sul:
  cassandra_data_sul:

services:

  # ── GEODNS ──
  geodns:
    build: ./geodns
    container_name: usp-airline-geodns
    ports:
      - "8080:8080"
    networks:
      - usp-airline-net
    restart: unless-stopped

  # ── REGIÃO SUL ──
  broker_sul:
    build: ./broker
    container_name: usp-airline-broker-sul
    ports:
      - "1891:1883"
    volumes:
      - mosquitto_data_sul:/mosquitto/data
    networks:
      - usp-airline-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "1883", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  banco_sul:
    image: cassandra:latest
    container_name: usp-airline-cassandra-sul
    mem_limit: 512m
    environment:
      CASSANDRA_CLUSTER_NAME: usp-airline
      CASSANDRA_DC: datacenter1
      CASSANDRA_SEEDS: banco_sul
    volumes:
      - cassandra_data_sul:/var/lib/cassandra
    networks:
      - usp-airline-net
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e \"SELECT release_version FROM system.local\" >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 10

  servidor_sul:
    build: ./servidor
    container_name: usp-airline-servidor-sul
    ports:
      - "4001:4000"
    environment:
      BROKER_URL: mqtt://broker_sul:1883
      HTTP_PORT: "4000"
      CASSANDRA_CONTACT_POINTS: banco_sul
      CASSANDRA_DATACENTER: datacenter1
      CASSANDRA_KEYSPACE: usp_airlines
    networks:
      - usp-airline-net
    depends_on:
      broker_sul: { condition: service_healthy }
      banco_sul: { condition: service_healthy }
    restart: unless-stopped

  # ── FRONTEND ──
  frontend:
    build: ./frontend
    container_name: usp-airline-frontend
    ports:
      - "3000:80"
    networks:
      - usp-airline-net
    depends_on:
      - servidor_sul
    restart: unless-stopped

  # ── AVIÕES ──────────────────────────────────────────────────────────
  aviao-la3105:
    build: ./aviao
    container_name: usp-airline-aviao-LA3105
    environment:
      GEODNS_URL: http://geodns:8080
      CALLSIGN: LA3105
      AIRLINE: LATAM
      IATA_AIRLINE: LA
      ORIGIN: GRU
      DESTINATION: GIG
      UPDATE_MS: "1000"
    networks: [usp-airline-net]
    depends_on: [geodns]
    restart: on-failure:5

