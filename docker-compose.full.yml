    environment:
      BROKER_URL: mqtt://broker_nordeste:1883
      HTTP_PORT: "4000"
      CASSANDRA_CONTACT_POINTS: banco_nordeste
      CASSANDRA_DATACENTER: datacenter1
      CASSANDRA_KEYSPACE: usp_airlines
    networks:
