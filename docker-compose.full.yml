  # ════════════════════════════════════════════════════════════════════
  #  REGIÃO NORTE
  # ════════════════════════════════════════════════════════════════════
  broker_norte:
    build: ./broker
    container_name: usp-airline-broker-norte
    ports:
      - "1883:1883" 
    volumes:
      - mosquitto_data_norte:/mosquitto/data
    networks:
      - usp-airline-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "1883", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  banco_norte:
    image: cassandra:latest
    container_name: usp-airline-cassandra-norte
    environment:
      CASSANDRA_CLUSTER_NAME: usp-airline
      CASSANDRA_DC: datacenter1
      CASSANDRA_SEEDS: banco_sul,banco_sudeste,banco_norte,banco_nordeste,banco_centro_oeste
    volumes:
      - cassandra_data_norte:/var/lib/cassandra
    networks:
      - usp-airline-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e \"SELECT release_version FROM system.local\" >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  servidor_norte:
    build: ./servidor
    container_name: usp-airline-servidor-norte
    ports:
      - "4003:4000"
    environment:
      BROKER_URL: mqtt://broker_norte:1883
      HTTP_PORT: "4000"
      CASSANDRA_CONTACT_POINTS: banco_norte
      CASSANDRA_DATACENTER: datacenter1
      CASSANDRA_KEYSPACE: usp_airlines
    networks:
      - usp-airline-net
    depends_on:
      broker_norte:
        condition: service_healthy
      banco_norte:
        condition: service_healthy
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════
  #  REGIÃO NORDESTE
  # ════════════════════════════════════════════════════════════════════
  broker_nordeste:
    build: ./broker
    container_name: usp-airline-broker-nordeste
    ports:
      - "1884:1883" 
    volumes:
      - mosquitto_data_nordeste:/mosquitto/data
    networks:
      - usp-airline-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "1883", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
