    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e \"SELECT release_version FROM system.local\" >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  servidor_sudeste:
    build: ./servidor
    container_name: usp-airline-servidor-sudeste
    ports:
      - "4002:4000"
    environment:
      BROKER_URL: mqtt://broker_sudeste:1883
      HTTP_PORT: "4000"
