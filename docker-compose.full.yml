  # ════════════════════════════════════════════════════════════════════
  #  FRONTEND — Nginx + Leaflet
  # ════════════════════════════════════════════════════════════════════
  frontend:
    build: ./frontend
    container_name: usp-airline-frontend
    ports:
      - "3000:80"
    networks:
      - usp-airline-net
    depends_on:
      - servidor_sul
      - servidor_sudeste
      - servidor_norte
      - servidor_nordeste
      - servidor_centro_oeste
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════
  #  AVIÕES — Publishers MQTT (1 container = 1 avião)
  # ════════════════════════════════════════════════════════════════════

  # ── LATAM ──────────────────────────────────────────────────────────
  aviao-la3105:
    build: ./aviao
    container_name: usp-airline-aviao-LA3105
    environment:
      GEODNS_URL: http://geodns:8080
      CALLSIGN: LA3105
      AIRLINE: LATAM
      IATA_AIRLINE: LA
      ORIGIN: GRU
      DESTINATION: GIG
      UPDATE_MS: "1000"
    networks: [usp-airline-net]
    depends_on:
      - geodns
    restart: on-failure:5

  aviao-la3240:
