# ═══════════════════════════════════════════════════════════════════════════════
#  Usp-airline — Sistema Distribuído de Rastreamento de Aviões
#
#  Arquitetura:
#    aviões (publishers) → Mosquitto MQTT (broker) → servidor (subscriber+WS) → frontend
#
#  Acesso:
#    Mapa:      http://localhost:3000
#    API REST:  http://localhost:4000/status
#               http://localhost:4000/voos
#               http://localhost:4000/eventos
#               http://localhost:4000/historico/{CALLSIGN}
#    MQTT:      mqtt://localhost:1883
#
#  Uso:
#    docker-compose up --build
#    ./scripts/add-aviao.sh LA9999 LATAM LA GRU POA
#    ./scripts/crash-test.sh          (testa tolerância a falhas)
#    ./scripts/network-delay.sh       (injeta latência)
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
#  usp-airline — Sistema Distribuído de Rastreamento de Aviões
# ═══════════════════════════════════════════════════════════════════════════════

name: usp-airline

networks:
  usp-airline-net:
    name: usp-airline-net
    driver: bridge

volumes:
  mosquitto_data_sul:
  mosquitto_data_sudeste:
  mosquitto_data_norte:
  mosquitto_data_nordeste:
  mosquitto_data_centro_oeste:
  
  cassandra_data_sul:
  cassandra_data_sudeste:
  cassandra_data_norte:
  cassandra_data_nordeste:
  cassandra_data_centro_oeste:

services:

  # ════════════════════════════════════════════════════════════════════
  #  GEODNS — Serviço de Descoberta de Região
  # ════════════════════════════════════════════════════════════════════
  geodns:
    build: ./geodns
    container_name: usp-airline-geodns
    ports:
      - "8080:8080"
    networks:
      - usp-airline-net
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════
  #  REGIÃO SUL
  # ════════════════════════════════════════════════════════════════════
  broker_sul:
    build: ./broker
    container_name: usp-airline-broker-sul
    ports:
      - "1881:1883" 
    volumes:
      - mosquitto_data_sul:/mosquitto/data
    networks:
      - usp-airline-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "1883", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  banco_sul:
    image: cassandra:latest
    container_name: usp-airline-cassandra-sul
    environment:
      CASSANDRA_CLUSTER_NAME: usp-airline
      CASSANDRA_DC: datacenter1
      CASSANDRA_SEEDS: banco_sul,banco_sudeste,banco_norte,banco_nordeste,banco_centro_oeste
    volumes:
      - cassandra_data_sul:/var/lib/cassandra
    networks:
      - usp-airline-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e \"SELECT release_version FROM system.local\" >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  servidor_sul:
    build: ./servidor
    container_name: usp-airline-servidor-sul
    ports:
      - "4001:4000"
    environment:
      BROKER_URL: mqtt://broker_sul:1883
      HTTP_PORT: "4000"
      CASSANDRA_CONTACT_POINTS: banco_sul
      CASSANDRA_DATACENTER: datacenter1
      CASSANDRA_KEYSPACE: usp_airlines
    networks:
      - usp-airline-net
    depends_on:
      broker_sul:
        condition: service_healthy
      banco_sul:
        condition: service_healthy
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════
  #  REGIÃO SUDESTE
  # ════════════════════════════════════════════════════════════════════
  broker_sudeste:
    build: ./broker
    container_name: usp-airline-broker-sudeste
    ports:
      - "1882:1883" 
    volumes:
      - mosquitto_data_sudeste:/mosquitto/data
    networks:
      - usp-airline-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "1883", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  banco_sudeste:
    image: cassandra:latest
    container_name: usp-airline-cassandra-sudeste
    environment:
      CASSANDRA_CLUSTER_NAME: usp-airline
      CASSANDRA_DC: datacenter1
      CASSANDRA_SEEDS: banco_sul,banco_sudeste,banco_norte,banco_nordeste,banco_centro_oeste
    volumes:
      - cassandra_data_sudeste:/var/lib/cassandra
    networks:
